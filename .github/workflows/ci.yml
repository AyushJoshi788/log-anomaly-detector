name: Log Anomaly Detection CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-detector:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate sample logs
        run: python log_generator/generate_logs.py

      - name: Run anomaly detection
        run: python src/anomaly_detector.py

      - name: Run root cause analysis
        run: python src/root_cause.py
